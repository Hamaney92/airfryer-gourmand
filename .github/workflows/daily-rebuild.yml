name: Publication programmee

# Reconstruit le site chaque jour pour reveler les articles dont la pubDate
# est arrivee. Tourne sur les serveurs GitHub : aucune machine a allumer.

on:
  schedule:
    - cron: "17 3 * * *"  # 03:17 UTC. PAS 06:00, PAS une heure ronde :
                          # GitHub met les crons planifies en file d'attente et les
                          # retarde de 30 min a 3 h aux heures rondes. Mesure du 06/08 :
                          # demande 06:00 UTC, execute reellement 08:24 a 09:45 UTC,
                          # soit APRES le briefing de 9h CEST -> la recette du jour
                          # etait encore en 404 au moment de l'epingler.
                          # 03:17 laisse ~6 h de marge meme avec le pire retard observe.
  workflow_dispatch:        # bouton "Run workflow" pour declencher a la main

permissions:
  contents: write

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit vide pour declencher le build Cloudflare
        run: |
          git config user.name "airfryer-gourmand-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "Revele les articles programmes du jour"
          git push
